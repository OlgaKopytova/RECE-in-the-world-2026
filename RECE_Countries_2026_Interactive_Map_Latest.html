<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RECE Team Site Visits, Holidays and Global Team Collaboration Across 2026</title>
<style>
:root {
  --ink: #252525;
  --muted: #6d6d6d;
  --panel: #ffffff;
  --canvas: #f6f4f1;
  --line: #ded8d2;
  --active-color: #8C2F0D;
  --shadow: 0 18px 50px rgba(60, 39, 25, 0.12);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
body { padding: 24px; }
.shell { max-width: 1420px; margin: 0 auto; }
.header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 0 0 16px; }
.eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #8a3b12; }
h1 { margin: 0; font-size: clamp(27px, 3vw, 42px); line-height: 1.04; letter-spacing: -.025em; }
.subtitle { margin: 9px 0 0; max-width: 850px; color: var(--muted); font-size: 15px; line-height: 1.5; }
.category-bar { display: grid; grid-template-columns: repeat(5, minmax(145px, 1fr)); gap: 10px; margin-bottom: 14px; }
.category-button { position: relative; min-height: 72px; padding: 12px 13px 11px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.78); text-align: left; cursor: pointer; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease; }
.category-button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(60,39,25,.08); }
.category-button[aria-pressed="true"] { border-color: var(--cat-color); box-shadow: 0 0 0 2px color-mix(in srgb, var(--cat-color) 18%, transparent); background: #fff; }
.category-topline { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #59534e; }
.swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--cat-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cat-color) 17%, transparent); }
.category-count { display: inline-block; margin-top: 7px; font-size: 23px; line-height: 1; font-weight: 700; color: #292929; }
.category-caption { display: inline-block; margin-left: 6px; color: #807a75; font-size: 11px; }
.card { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 15px 18px; border-bottom: 1px solid #eee8e2; }
.active-summary { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.active-summary strong { font-size: 17px; }
.active-summary span { color: var(--muted); font-size: 13px; }
.region-buttons { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
.region-button, .zoom-button { border: 1px solid #d9d2cb; border-radius: 9px; background: #fff; color: #45413d; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.region-button { padding: 7px 10px; }
.region-button:hover, .zoom-button:hover { background: #f7f3ef; }
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 285px; min-height: 590px; }
.map-stage { position: relative; min-width: 0; overflow: hidden; background: radial-gradient(circle at 51% 43%, #fefefe 0, #f9f7f4 63%, #f0ece7 100%); border-right: 1px solid #eee8e2; }
#worldMap { width: 100%; height: 100%; min-height: 590px; display: block; cursor: grab; touch-action: auto; }
.js #worldMap { touch-action: none; }
#worldMap.dragging { cursor: grabbing; }
.ocean-grid line { stroke: #dad6d1; stroke-width: .65; opacity: .55; vector-effect: non-scaling-stroke; }
.country { fill: #ebe7e2; stroke: #ffffff; stroke-width: .7; vector-effect: non-scaling-stroke; transition: fill .18s ease, opacity .18s ease, stroke .18s ease; }
.country.highlighted { cursor: pointer; }
.country.highlighted:hover, .country.focused { stroke: #2e2925; stroke-width: 1.35; }
.region-overlay { display: none; pointer-events: none; fill: var(--active-color); fill-opacity: .30; stroke: var(--active-color); stroke-opacity: .95; stroke-width: 1.45; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.region-overlay.interactive { pointer-events: visiblePainted; cursor: pointer; }
.region-overlay.focused { fill-opacity: .40; stroke: #211d1a; stroke-width: 2.1; }
.location-marker { display: none; cursor: pointer; }
.marker-halo { fill: #ffffff; stroke: rgba(36,31,27,.28); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.marker-dot { fill: #bfb7b0; stroke: #ffffff; stroke-width: 1; vector-effect: non-scaling-stroke; transition: fill .18s ease, opacity .18s ease; }
.location-marker:hover .marker-halo, .location-marker.focused .marker-halo { stroke: #2e2925; stroke-width: 1.8; }
.zoom-controls { position: absolute; left: 14px; bottom: 14px; display: grid; grid-template-columns: repeat(3, 38px); gap: 7px; }
.zoom-button { width: 38px; height: 36px; font-size: 18px; box-shadow: 0 4px 13px rgba(50,36,24,.10); }
.zoom-button.reset { font-size: 11px; }
.tooltip { position: absolute; z-index: 10; min-width: 230px; max-width: 300px; padding: 12px 13px; border: 1px solid rgba(72,53,41,.16); border-radius: 12px; background: rgba(255,255,255,.97); box-shadow: 0 14px 36px rgba(45,31,22,.18); pointer-events: none; opacity: 0; transform: translate(10px, 10px); transition: opacity .08s ease; }
.tooltip.visible { opacity: 1; }
.tooltip-name { margin: 0 0 3px; font-size: 16px; font-weight: 700; }
.tooltip-total { margin: 0 0 9px; color: #716b66; font-size: 12px; line-height: 1.4; }
.tooltip-row { display: grid; grid-template-columns: 11px 1fr auto; gap: 7px; align-items: center; padding: 5px 0; border-top: 1px solid #f0ece8; font-size: 12px; }
.tooltip-row.active { font-weight: 700; }
.tooltip-dot { width: 8px; height: 8px; border-radius: 50%; }
.tooltip-status { color: #5d5752; font-size: 11px; font-weight: 700; white-space: nowrap; }
.side-panel { padding: 18px 16px; background: #fcfbf9; }
.side-panel h2 { margin: 0; font-size: 15px; }
.side-panel h3 { margin: 0; font-size: 12px; }
.side-note { margin: 6px 0 14px; color: var(--muted); font-size: 12px; line-height: 1.42; }
.country-list { display: grid; gap: 6px; max-height: 345px; overflow: auto; padding-right: 4px; }
.country-item, .regional-item { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; padding: 8px 9px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: inherit; text-align: left; cursor: pointer; }
.country-item:hover, .regional-item:hover { border-color: #ddd4cb; background: #fff; }
.country-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--active-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--active-color) 15%, transparent); }
.country-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 700; }
.item-count { min-width: 58px; text-align: right; color: #5d5752; font-size: 11px; font-weight: 700; }
.regional-block { display: none; margin-top: 17px; padding-top: 15px; border-top: 1px solid #eae3dd; }
.regional-list { display: grid; gap: 6px; margin-top: 8px; }
.pattern-swatch { width: 12px; height: 12px; border: 1.5px solid var(--active-color); border-radius: 3px; background: color-mix(in srgb, var(--active-color) 30%, white); }
.legend-block { margin-top: 17px; padding-top: 15px; border-top: 1px solid #eae3dd; }
.legend-title { margin-bottom: 9px; font-size: 11px; font-weight: 700; color: #5e5853; }
.legend-row { display: grid; grid-template-columns: 15px 1fr; gap: 8px; align-items: center; margin: 7px 0; color: #6f6964; font-size: 11px; }
.solid-swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--active-color); }
button { -webkit-tap-highlight-color: transparent; }
.category-button, .region-button, .zoom-button, .country-item, .regional-item { touch-action: manipulation; }
.map-hint { display: none; position: absolute; z-index: 8; top: 10px; left: 10px; max-width: calc(100% - 20px); padding: 7px 10px; border: 1px solid rgba(72,53,41,.13); border-radius: 999px; background: rgba(255,255,255,.91); box-shadow: 0 4px 14px rgba(45,31,22,.10); color: #5f5852; font-size: 11px; font-weight: 700; line-height: 1.25; pointer-events: none; backdrop-filter: blur(5px); }
.tooltip-close { display: none; position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: #f1ece7; color: #3d3834; font: inherit; font-size: 22px; line-height: 1; cursor: pointer; }


.no-js .zoom-controls,
.no-js .region-buttons,
.no-js .map-hint { display: none !important; }
.no-js .category-button,
.no-js .country-item,
.no-js .regional-item { cursor: default; }
.no-js .category-button:not([data-category="all"]) { opacity: .58; }
.no-js .category-button,
.no-js .country-item,
.no-js .regional-item { pointer-events: none; }
.no-js #worldMap { cursor: default; }

@media (max-width: 1050px) {
  .category-bar { grid-template-columns: repeat(3, 1fr); }
  .map-layout { grid-template-columns: 1fr; }
  .map-stage { border-right: 0; border-bottom: 1px solid #eee8e2; }
  .side-panel { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 20px; }
  .country-list { max-height: 260px; }
}

@media (hover: none), (pointer: coarse) {
  .category-button:hover { transform: none; box-shadow: none; }
  .region-button:hover, .zoom-button:hover { background: #fff; }
  .country-item:hover, .regional-item:hover { border-color: transparent; background: transparent; }
  .country.highlighted:hover { stroke: #ffffff; stroke-width: .7; }
}

@media (max-width: 720px), (max-width: 900px) and (pointer: coarse) {
  html { -webkit-text-size-adjust: 100%; }
  body {
    padding-top: max(10px, env(safe-area-inset-top));
    padding-right: max(10px, env(safe-area-inset-right));
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    padding-left: max(10px, env(safe-area-inset-left));
  }
  .shell { width: 100%; }
  .header { align-items: flex-start; flex-direction: column; gap: 0; margin-bottom: 13px; }
  .eyebrow { margin-bottom: 5px; font-size: 11px; }
  h1 { font-size: clamp(28px, 9vw, 36px); }
  .subtitle { margin-top: 7px; font-size: 14px; line-height: 1.42; }

  .category-bar {
    display: flex;
    grid-template-columns: none;
    gap: 8px;
    overflow-x: auto;
    margin: 0 0 12px;
    padding: 1px 0 5px;
    touch-action: pan-x;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
    overscroll-behavior-x: contain;
  }
  .category-bar::-webkit-scrollbar, .region-buttons::-webkit-scrollbar { display: none; }
  .category-button {
    flex: 0 0 min(68vw, 190px);
    min-height: 76px;
    padding: 12px 13px;
    border-radius: 13px;
    scroll-snap-align: start;
  }
  .category-count { font-size: 22px; }

  .card { border-radius: 16px; box-shadow: 0 12px 35px rgba(60,39,25,.11); }
  .card-head { align-items: flex-start; flex-direction: column; gap: 10px; padding: 12px; }
  .active-summary strong { font-size: 16px; }
  .region-buttons {
    width: 100%;
    flex-wrap: nowrap;
    justify-content: flex-start;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
    overscroll-behavior-x: contain;
  }
  .region-button { flex: 0 0 auto; min-height: 44px; padding: 10px 13px; border-radius: 10px; }

  .map-layout { min-height: 0; }
  .map-stage { height: clamp(300px, 80vw, 350px); min-height: 300px; }
  #worldMap { height: 100%; min-height: 0; }
  .map-hint { display: block; }
  .zoom-controls { z-index: 11; left: 10px; bottom: 10px; grid-template-columns: repeat(3, 44px); gap: 7px; }
  .zoom-button { width: 44px; height: 44px; border-radius: 11px; font-size: 21px; }
  .zoom-button.reset { font-size: 11px; }

  .tooltip {
    left: 10px !important;
    right: 10px;
    top: auto !important;
    bottom: 64px;
    width: auto;
    min-width: 0;
    max-width: none;
    max-height: min(54%, 240px);
    overflow: auto;
    padding: 14px 48px 14px 14px;
    border-radius: 15px;
    transform: none;
    -webkit-overflow-scrolling: touch;
  }
  .tooltip.visible { pointer-events: auto; }
  .tooltip-close { display: block; }
  .tooltip-name { padding-right: 4px; font-size: 17px; }
  .tooltip-row { min-height: 34px; }

  .side-panel { display: block; padding: 15px 12px 17px; }
  .side-note { font-size: 12px; }
  .country-list { grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: none; overflow: visible; padding-right: 0; }
  .country-item, .regional-item { min-height: 44px; padding: 9px; border-color: #e7e0da; background: #fff; }
  .country-item:active, .regional-item:active, .region-button:active, .zoom-button:active { background: #f4efea; }
  .regional-block { margin-top: 16px; }
  .footer { flex-direction: column; gap: 3px; margin-top: 9px; }
}

@media (max-width: 380px) {
  .category-button { flex-basis: 76vw; }
  .country-list { grid-template-columns: 1fr; }
  .map-stage { height: 300px; min-height: 300px; }
}

@media (orientation: landscape) and (max-height: 540px) and (pointer: coarse) {
  body { padding-top: 8px; padding-bottom: 8px; }
  .header { margin-bottom: 9px; }
  h1 { font-size: 27px; }
  .subtitle { font-size: 13px; }
  .category-button { flex-basis: 170px; min-height: 68px; }
  .map-stage { height: max(300px, calc(100svh - 150px)); min-height: 300px; }
  #worldMap { height: 100%; min-height: 0; }
  .map-hint { font-size: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>

  fitBBox(box, tiny ? 2.3 : .55, tiny ? 10 : 7);
  setSelected(code);
  showTooltip(code);
  if (mobileLayoutQuery.matches) {
    requestAnimationFrame(() => stage.scrollIntoView({behavior: 'smooth', block: 'start'}));
  }
}
function clientToSvg(clientX, clientY) {
  const rect = svg.getBoundingClientRect();
  return {x: (clientX - rect.left) * MAP_W / rect.width, y: (clientY - rect.top) * MAP_H / rect.height};
}
function zoomAt(factor, anchor={x: MAP_W/2, y: MAP_H/2}) {
  const old = scale;
  const next = Math.max(1, Math.min(12, old * factor));
  tx = anchor.x - (anchor.x - tx) * (next / old);
  ty = anchor.y - (anchor.y - ty) * (next / old);
  scale = next;
  if (scale === 1) { tx = 0; ty = 0; }
  applyTransform();
}
function setSelected(code) {
  selectedCode = code;
  document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
  if (!code) return;
  const path = document.getElementById(`country-${CSS.escape(code)}`);
  if (path) path.classList.add('focused');
  document.querySelectorAll(`.location-marker[data-code="${CSS.escape(code)}"]`).forEach(el => el.classList.add('focused'));
  document.querySelectorAll(`.region-overlay[data-region="${CSS.escape(code)}"]`).forEach(el => el.classList.add('focused'));
}
function visitLabel(count) {
  return `${count} visit${count === 1 ? '' : 's'}`;
}
function metricValue(cat, count) {
  return visitLabel(count);
}
function tooltipRowsFor(code) {
  const source = isRegionCode(code) ? REGIONAL_ENTRIES[code] : DATA[code];
  return SOURCE_CATEGORIES.filter(cat => Number(source?.counts?.[cat] || 0) > 0).map(cat => {
    const count = Number(source?.counts?.[cat] || 0);
    return `<div class="tooltip-row ${cat === activeCategory ? 'active' : ''}">
      <span class="tooltip-dot" style="background:${CATEGORIES[cat].color}"></span>
      <span>${CATEGORIES[cat].label}</span>
      <strong class="tooltip-status">${metricValue(cat, count)}</strong>
    </div>`;
  }).join('');
}
function showTooltip(code, event) {
  const resolvedCode = resolvedActivityCode(code) || (isRegionCode(code) && isDirect(code) ? code : null);
  if (!resolvedCode) return;
  code = resolvedCode;
  const source = isRegionCode(code) ? REGIONAL_ENTRIES[code] : DATA[code];
  const name = source?.name || COUNTRY_NAMES[code] || code;
  const total = Number(source?.counts?.all || 0);
  tooltip.innerHTML = `<button class="tooltip-close" type="button" aria-label="Close details">&times;</button><div class="tooltip-name">${name}</div><div class="tooltip-total">${visitLabel(total)} across all activity</div>${tooltipRowsFor(code)}`;
  tooltip.dataset.code = code;
  tooltip.classList.add('visible');

  if (mobileLayoutQuery.matches) return;

  const rect = stage.getBoundingClientRect();
  const clientX = Number.isFinite(event?.clientX) ? event.clientX : rect.left + rect.width / 2;
  const clientY = Number.isFinite(event?.clientY) ? event.clientY : rect.top + rect.height / 2;
  let x = clientX - rect.left + 12;
  let y = clientY - rect.top + 12;
  const tw = tooltip.offsetWidth || 250;
  const th = tooltip.offsetHeight || 190;
  if (x + tw > rect.width - 8) x = clientX - rect.left - tw - 12;
  if (y + th > rect.height - 8) y = rect.height - th - 8;
  tooltip.style.left = `${Math.max(8,x)}px`;
  tooltip.style.top = `${Math.max(8,y)}px`;
}
function hideTooltip() {
  tooltip.classList.remove('visible');
  tooltip.removeAttribute('data-code');
}
tooltip.addEventListener('click', event => {
  if (event.target.closest('.tooltip-close')) {
    setSelected(null);
    hideTooltip();
  }
});
function attachMapEvents(element) {
  const rawCode = element.dataset.code;
  if (!DATA[rawCode] && !REGIONAL_ENTRIES[rawCode] && !REGION_BY_MEMBER[rawCode]) return;
  element.addEventListener('pointermove', event => {
    const code = resolvedActivityCode(rawCode);
    if (code && !dragging && event.pointerType !== 'touch') showTooltip(code, event);
  });
  element.addEventListener('pointerleave', event => {
    if (event.pointerType !== 'touch') hideTooltip();
  });
  element.addEventListener('click', event => {
    const code = resolvedActivityCode(rawCode);
    if (moved || !code) return;
    const opening = selectedCode !== code || !tooltip.classList.contains('visible');
    setSelected(opening ? code : null);
    if (opening) showTooltip(code, event);
    else hideTooltip();
  });
}
countryElements.forEach(attachMapEvents);
markerElements.forEach(attachMapEvents);
regionOverlayElements.forEach(overlay => { overlay.style.pointerEvents = 'none'; });

function renderCountryList() {
  const countries = Object.entries(DATA)
    .filter(([, item]) => item.categories[activeCategory])
    .map(([code, item]) => ({code, name: item.name, count: Number(item.counts[activeCategory] || 0)}))
    .sort((a,b) => a.name.localeCompare(b.name));
  countryList.innerHTML = countries.map(item => `
    <button class="country-item" data-code="${item.code}">
      <span class="country-dot"></span>
      <span class="country-name">${item.name}</span>
      <span class="item-count">${visitLabel(item.count)}</span>
    </button>`).join('');
  countryList.querySelectorAll('.country-item').forEach(button => button.addEventListener('click', () => focusLocation(button.dataset.code)));
}
function renderRegionalList() {
  const regions = Object.entries(REGIONAL_ENTRIES)
    .filter(([, item]) => item.categories[activeCategory])
    .map(([code, item]) => ({code, name: item.name, count: Number(item.counts[activeCategory] || 0)}));
  regionalBlock.style.display = regions.length ? 'block' : 'none';
  regionalList.innerHTML = regions.map(item => `
    <button class="regional-item" data-code="${item.code}">
      <span class="pattern-swatch"></span>
      <span class="country-name">${item.name}</span>
      <span class="item-count">${visitLabel(item.count)}</span>
    </button>`).join('');
  regionalList.querySelectorAll('.regional-item').forEach(button => button.addEventListener('click', () => focusLocation(button.dataset.code)));
}
function updateCategory(category) {
  activeCategory = category;
  const color = CATEGORIES[category].color;
  document.documentElement.style.setProperty('--active-color', color);
  document.querySelectorAll('.category-button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.category === category)));

  countryElements.forEach(path => {
    const code = path.dataset.code;
    const direct = isDirect(code, category);
    const regional = activeRegionCodesFor(code, category).length > 0;
    path.style.fill = direct ? mix('#fffaf5', color, .83) : '#ebe7e2';
    path.style.opacity = direct || regional ? '1' : '.92';
    path.classList.toggle('highlighted', direct || regional);
    path.style.cursor = direct || regional ? 'pointer' : 'default';
    const name = DATA[code]?.name || path.dataset.name;
    const state = direct ? visitLabel(Number(DATA[code]?.counts?.[category] || 0)) : regional ? `included through the ${REGIONAL_ENTRIES[activeRegionCodesFor(code, category)[0]]?.name || 'selected'} region` : 'not included';
    path.setAttribute('aria-label', `${name}: ${state} in ${CATEGORIES[category].label}`);
  });

  regionOverlayElements.forEach(overlay => {
    const regionCode = overlay.dataset.region;
    const visible = Boolean(REGIONAL_ENTRIES[regionCode]?.categories?.[category]);
    overlay.style.display = visible ? 'inline' : 'none';
    overlay.style.fill = color;
    overlay.style.stroke = color;
    overlay.style.fillOpacity = visible ? '.30' : '0';
    overlay.style.opacity = '1';
    overlay.classList.remove('interactive');
    overlay.style.pointerEvents = 'none';
    overlay.setAttribute('aria-label', visible ? `${REGIONAL_ENTRIES[regionCode].name} region: ${REGIONAL_ENTRIES[regionCode].counts[category] || 0} recorded in ${CATEGORIES[category].label}` : '');
    overlay.setAttribute('aria-hidden', visible ? 'false' : 'true');
  });

  markerElements.forEach(marker => {
    const direct = isDirect(marker.dataset.code, category);
    marker.style.display = direct ? '' : 'none';
    marker.querySelector('.marker-dot').style.fill = mix('#fffaf5', color, .83);
  });

  document.getElementById('activeTitle').textContent = CATEGORIES[category].label;
  document.getElementById('activeStats').textContent = `${SUMMARY[category].countries} countries`;
  renderCountryList();
  renderRegionalList();
  setSelected(null);
  hideTooltip();
}

document.querySelectorAll('.category-button').forEach(button => button.addEventListener('click', () => updateCategory(button.dataset.category)));
document.querySelectorAll('.region-button').forEach(button => button.addEventListener('click', () => focusRegion(button.dataset.region)));
document.getElementById('zoomIn').addEventListener('click', () => zoomAt(1.35));
document.getElementById('zoomOut').addEventListener('click', () => zoomAt(1/1.35));
document.getElementById('zoomReset').addEventListener('click', () => focusRegion('world'));

svg.addEventListener('wheel', event => {
  event.preventDefault();
  zoomAt(event.deltaY < 0 ? 1.18 : 1/1.18, clientToSvg(event.clientX, event.clientY));
}, {passive:false});
function pointerPair() {
  return Array.from(activePointers.values()).slice(0, 2);
}
function beginPinch() {
  const points = pointerPair();
  if (points.length < 2) return;
  const [a, b] = points;
  const midpointClient = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
  const midpointSvg = clientToSvg(midpointClient.x, midpointClient.y);
  const distance = Math.hypot(b.x - a.x, b.y - a.y);
  pinchStart = {
    distance: Math.max(distance, 1),
    scale,
    worldX: (midpointSvg.x - tx) / scale,
    worldY: (midpointSvg.y - ty) / scale
  };
  moved = true;
}
svg.addEventListener('pointerdown', event => {
  if (event.pointerType === 'mouse' && event.button !== 0) return;
  activePointers.set(event.pointerId, {x: event.clientX, y: event.clientY});
  try { svg.setPointerCapture(event.pointerId); } catch (_) {}
  dragging = true;
  svg.classList.add('dragging');

  if (activePointers.size === 1) {
    moved = false;
    dragStart = {x: event.clientX, y: event.clientY, tx, ty};
    if (event.pointerType === 'touch' && !event.target.closest('.highlighted, .location-marker')) {
      setSelected(null);
      hideTooltip();
    }
  } else if (activePointers.size === 2) {
    hideTooltip();
    beginPinch();
  }
});
svg.addEventListener('pointermove', event => {
  if (!activePointers.has(event.pointerId)) return;
  activePointers.set(event.pointerId, {x: event.clientX, y: event.clientY});

  if (activePointers.size >= 2) {
    if (!pinchStart) beginPinch();
    const [a, b] = pointerPair();
    const distance = Math.hypot(b.x - a.x, b.y - a.y);
    const midpointClient = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
    const midpointSvg = clientToSvg(midpointClient.x, midpointClient.y);
    const nextScale = Math.max(1, Math.min(12, pinchStart.scale * distance / pinchStart.distance));
    scale = nextScale;
    tx = midpointSvg.x - pinchStart.worldX * scale;
    ty = midpointSvg.y - pinchStart.worldY * scale;
    if (scale === 1) { tx = 0; ty = 0; }
    moved = true;
    applyTransform();
    return;
  }

  if (!dragStart) return;
  const rect = svg.getBoundingClientRect();
  const dx = (event.clientX - dragStart.x) * MAP_W / rect.width;
  const dy = (event.clientY - dragStart.y) * MAP_H / rect.height;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  tx = dragStart.tx + dx;
  ty = dragStart.ty + dy;
  applyTransform();
  if (moved) hideTooltip();
});
function endPointer(event) {
  activePointers.delete(event.pointerId);
  try { svg.releasePointerCapture(event.pointerId); } catch (_) {}

  if (activePointers.size === 1) {
    const remaining = activePointers.values().next().value;
    dragStart = {x: remaining.x, y: remaining.y, tx, ty};
    pinchStart = null;
    moved = true;
    return;
  }

  if (activePointers.size === 0) {
    dragging = false;
    dragStart = null;
    pinchStart = null;
    svg.classList.remove('dragging');
    setTimeout(() => { moved = false; }, 0);
  }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('lostpointercapture', event => {
  if (activePointers.has(event.pointerId)) endPointer(event);
});
svg.addEventListener('dblclick', event => {
  event.preventDefault();
  zoomAt(1.45, clientToSvg(event.clientX, event.clientY));
});
document.addEventListener('keydown', event => { if (event.key === 'Escape') { setSelected(null); hideTooltip(); } });
window.addEventListener('orientationchange', hideTooltip);

applyTransform();
updateCategory('all');
document.documentElement.classList.remove('no-js');
document.documentElement.classList.add('js');
</script>
</body>
